[postgres]
# Copy this file to config/postgres.ini. That local file is ignored by Git.
host = 127.0.0.1
port = 5433
database = cudaheat
username = cudaheat_app

# The password itself stays outside this file and Git.
# Leave its environment variable unset to use a standard ~/.pgpass file instead.
password_env = CUDAHEAT_POSTGRES_PASSWORD

# PostgreSQL/libpq connection settings.
sslmode = prefer
connect_timeout = 10
application_name = cudaheat
