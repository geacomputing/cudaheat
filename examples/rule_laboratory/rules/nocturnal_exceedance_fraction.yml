id: nocturnal_exceedance_fraction
version: "1.0.3"

short_name: Nocturnal exceedance fraction
long_name: Fraction of nighttime event hours exceeding the climatological threshold

symbol: NEF

category:
  primary: diurnal_cycle
  secondary: nocturnal_persistence

description: >
  Fraction of valid nighttime hourly SST observations exceeding
  the corresponding climatological percentile threshold during
  a detected marine heatwave event.

  Nighttime is defined as 20:00–06:00 local solar time,
  calculated from UTC timestamps and longitude.

interpretation: >
  Values approaching 1 indicate persistent nighttime threshold
  exceedance. Values approaching 0 indicate limited nighttime
  exceedance. This metric measures nocturnal persistence rather
  than thermal intensity.

formula_latex: |
  NEF =
  \frac{
    \displaystyle\sum_{t=t_s}^{t_e}
    \mathbf{1}_{\mathrm{night}}(p,t)
    \mathbf{1}[SST_{p,t}>T_{p,h(t)}]
    \mathbf{1}_{\mathrm{valid}}(p,t)
  }{
    \displaystyle\sum_{t=t_s}^{t_e}
    \mathbf{1}_{\mathrm{night}}(p,t)
    \mathbf{1}_{\mathrm{valid}}(p,t)
  }

symbols:
  NEF: "Nocturnal exceedance fraction"
  SST_p_t: "Observed SST at point p and time t"
  T_p_h: "Climatological threshold at point p and climatological hour h(t)"
  p: "Spatial point associated with the event"
  t: "Hourly time index"
  t_s: "Event start"
  t_e: "Event end"
  h(t): "Climatological month-day-hour corresponding to time t"
  night: "Indicator for local nighttime hours"
  valid: "Indicator for finite SST and threshold"

output:
  name: nocturnal_exceedance_fraction
  unit: dimensionless
  range: [0.0, 1.0]
  dimensions: [event]

python: |
  def calculate(context):
      xp = context.xp

      sst = context.sst
      threshold = context.threshold

      # Existing RuleContext property:
      # shape = (time, point)
      hours = context.local_hour

      # Nighttime: 20:00–06:00 local solar time.
      night = (hours >= 20.0) | (hours < 6.0)

      valid = (
          xp.isfinite(sst)
          & xp.isfinite(threshold)
          & night
      )

      above = valid & (sst > threshold)

      night_hours = context.count(valid)
      exceedance_hours = context.count(above)

      value = xp.full(
          night_hours.shape,
          xp.nan,
          dtype=xp.float64,
      )

      xp.divide(
          exceedance_hours,
          night_hours,
          out=value,
          where=night_hours > 0,
      )

      return {
          "value": value,
          "night_hours": night_hours,
          "exceedance_hours": exceedance_hours,
      }