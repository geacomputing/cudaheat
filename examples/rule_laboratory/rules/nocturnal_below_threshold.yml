id: nocturnal_below_threshold_fraction
version: "1.0.0"

short_name: Nocturnal below-threshold fraction
long_name: Fraction of nighttime event hours below the climatological threshold

symbol: NBTF

category:
  primary: diurnal_cycle
  secondary: nocturnal_recovery

description: >
  Fraction of valid nighttime hourly SST observations during
  a marine heatwave event that fall below the corresponding
  climatological percentile threshold.

  Nighttime is defined as 20:00–06:00 local solar time,
  calculated from UTC timestamps and longitude.

interpretation: >
  Values approaching 1 indicate frequent nighttime interruption
  of marine heatwave conditions. Values approaching 0 indicate
  persistent nighttime threshold exceedance.

  This metric measures the frequency of below-threshold
  conditions, not the magnitude of cooling.

formula_latex: |
  NBTF =
  \frac{
    \displaystyle\sum_{t=t_s}^{t_e}
    \mathbf{1}_{\mathrm{night}}(p,t)
    \mathbf{1}[SST_{p,t}<T_{p,h(t)}]
    \mathbf{1}_{\mathrm{valid}}(p,t)
  }{
    \displaystyle\sum_{t=t_s}^{t_e}
    \mathbf{1}_{\mathrm{night}}(p,t)
    \mathbf{1}_{\mathrm{valid}}(p,t)
  }

symbols:
  NBTF: "Nocturnal below-threshold fraction"
  SST_p_t: "Observed SST at point p and time t"
  T_p_h: "Climatological threshold at point p and hour h(t)"
  p: "Spatial point associated with the event"
  t: "Hourly time index"
  t_s: "Event start"
  t_e: "Event end"
  h(t): "Climatological month-day-hour corresponding to time t"
  night: "Indicator for nighttime hours"
  valid: "Indicator for finite SST and threshold"

output:
  name: nocturnal_below_threshold_fraction
  unit: dimensionless
  range: [0.0, 1.0]
  dimensions: [event]

python: |
  def calculate(context):
      xp = context.xp

      sst = context.sst
      threshold = context.threshold
      hours = context.local_hour

      night = (hours >= 20.0) | (hours < 6.0)

      valid = (
          xp.isfinite(sst)
          & xp.isfinite(threshold)
          & night
      )

      below = valid & (sst < threshold)

      night_hours = context.count(valid)
      below_hours = context.count(below)

      value = xp.full(
          night_hours.shape,
          xp.nan,
          dtype=xp.float64,
      )

      xp.divide(
          below_hours,
          night_hours,
          out=value,
          where=night_hours > 0,
      )

      return {
          "value": value,
          "night_hours": night_hours,
          "below_hours": below_hours,
      }